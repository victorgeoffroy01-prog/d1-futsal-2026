# Garde l'appli éveillée : visite 2 fois par jour (8h et 20h, heure de Paris en hiver).
# Si Streamlit l'a mise en veille, le script clique sur le bouton de réveil.
name: Reveil appli
on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch: {}       # bouton "Run workflow" pour lancer à la main
jobs:
  reveil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python reveil.py
        env:
          APP_URL: https://d1futsal.streamlit.app    # <- remplacer par l'adresse exacte de l'appli
